<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b10"><title>Terminal — Cifra Club API</title>
<style>
:root{color-scheme:dark;--bg:#090b10;--panel:#10141d;--line:#202938;--muted:#8491a5;--green:#79e2ad;--blue:#82b7ff;--red:#ff8585}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -30%,#1a2a3c 0,transparent 55%),var(--bg);color:#e8edf5;font:14px/1.5 Inter,ui-sans-serif,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}
.shell{width:min(1050px,100%);border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#0b0e14;box-shadow:0 24px 90px #0009}
.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#111722;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;font-weight:650}.mark{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 16px #79e2ad88}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}.dot{width:7px;height:7px;border-radius:50%;background:#677386}.dot.on{background:var(--green);box-shadow:0 0 10px #79e2ad88}
.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#151d29;color:#cbd5e1;border-radius:8px;padding:7px 11px;cursor:pointer}
main{padding:22px}.hint{color:var(--muted);font-size:12px;margin:0 0 14px}.terminal{height:min(62vh,560px);min-height:320px;overflow:auto;background:#080b10;border:1px solid #1c2634;border-radius:10px;padding:17px;font:13px/1.65 "JetBrains Mono",Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.line{margin:0 0 5px}.prompt{color:var(--green)}.out{color:#d5deeb}.err{color:var(--red)}.info{color:var(--blue)}
.inputrow{display:flex;gap:10px;align-items:center;margin-top:12px;background:#0d121a;border:1px solid var(--line);border-radius:9px;padding:0 12px}.promptlabel{color:var(--green);font:13px monospace}.inputrow input{min-width:0;flex:1;background:transparent;border:0;outline:0;color:#f2f5fa;padding:13px 0;font:13px monospace}.send{border:0;background:transparent;color:var(--green);font-weight:700;cursor:pointer;padding:10px}
footer{display:flex;justify-content:space-between;gap:10px;color:#66758a;font-size:11px;padding:13px 2px 0}
@media(max-width:600px){body{padding:0}.shell{min-height:100vh;border-radius:0;border:0;display:flex;flex-direction:column}.top{padding:0 13px}.brand{font-size:13px}.actions .btn{padding:6px 8px}main{padding:13px;display:flex;flex-direction:column;flex:1}.terminal{height:auto;min-height:55vh;flex:1;font-size:12px}footer{font-size:10px}}
</style></head>
<body><section class="shell"><header class="top"><div class="brand"><span class="mark"></span><span>CIFRA CLUB <span style="color:#8290a4">/ API TERMINAL</span></span></div><div class="actions"><span class="status"><i class="dot" id="dot"></i><span id="status">conectando</span></span><button class="btn" id="reconnect">Reconectar</button></div></header>
<main><p class="hint">Terminal de comandos permitidos · sessão segura · sem acesso ao shell do sistema</p><div class="terminal" id="screen" role="log" aria-live="polite"></div><form class="inputrow" id="form"><span class="promptlabel">api $</span><input id="command" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Digite help para começar"><button class="send" type="submit">ENTER ↵</button></form><footer><span>API v2.0.0 · WebSocket</span><span>↑ / ↓ histórico de comandos</span></footer></main></section>
<script>
const screen=document.getElementById('screen'),input=document.getElementById('command'),statusEl=document.getElementById('status'),dot=document.getElementById('dot');let ws,history=[],historyIndex=0;
function line(text,kind='out'){const el=document.createElement('div');el.className='line '+kind;el.textContent=text;screen.appendChild(el);screen.scrollTop=screen.scrollHeight}
function connect(){if(ws)ws.close();statusEl.textContent='conectando';dot.className='dot';const proto=location.protocol==='https:'?'wss:':'ws:';ws=new WebSocket(proto+'//'+location.host+'/v1/terminal/ws');ws.onopen=()=>{statusEl.textContent='online';dot.className='dot on'};ws.onclose=()=>{statusEl.textContent='desconectado';dot.className='dot'};ws.onerror=()=>{statusEl.textContent='erro de conexão'};ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='ready')line(m.text,'info');else if(m.type==='clear')screen.textContent='';else if(m.type==='error')line(m.text,'err');else if(m.type==='output')line(m.text)}}
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const cmd=input.value.trim();if(!cmd)return;line('api $ '+cmd,'prompt');history.push(cmd);historyIndex=history.length;if(cmd==='clear'){screen.textContent='';input.value='';return}if(ws&&ws.readyState===WebSocket.OPEN)ws.send(cmd);else line('WebSocket indisponível. Clique em Reconectar.','err');input.value=''});
input.addEventListener('keydown',e=>{if(e.key==='ArrowUp'){e.preventDefault();historyIndex=Math.max(0,historyIndex-1);input.value=history[historyIndex]||''}if(e.key==='ArrowDown'){e.preventDefault();historyIndex=Math.min(history.length,historyIndex+1);input.value=history[historyIndex]||''}});
document.getElementById('reconnect').onclick=connect;connect();input.focus();
</script></body></html>
